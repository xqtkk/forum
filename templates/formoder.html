<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request for promotion to moderator</title> <!-- Подключение стилей -->
<link rel="stylesheet" href="/static/app.css?v=5"><script src="/static/app.js?v=5" defer></script></head>
<body class="page-formoder">
    {{template "site-header" .}}
    <main>
        <section class="registration-form">
            <h1 class="form-title">Request for promotion to moderator</h1>
            <form action="/submit-promotion-request" method="POST">
                <div class="form-group">
                    <label for="reason">Why do you want to become a moderator?</label>
                    <textarea id="reason" name="reason" rows="4" placeholder="Describe your reasons" required></textarea>
                </div>
                <button type="submit" class="submit-button">Submit a request</button>
            </form>
        </section>
    </main>
{{template "site-footer" .}}</body>
</html>
