<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories</title>
<link rel="stylesheet" href="/static/app.css?v=5"><script src="/static/app.js?v=5" defer></script></head>
<body class="page-categories">
{{template "site-header" .}}
<main>
  <section class="content">
    <h1>Categories</h1>

    <div class="category-section">
      <h2>Add Category</h2>
      <form method="post" action="/categories?action=create" class="category-form">
        <input type="text" name="name" aria-label="Category name" placeholder="Category name" required>
        <button type="submit">Add Category</button>
      </form>
    </div>

    <div class="category-list">
      <h2>Existing Categories</h2>
      <ul>
        {{range .Categories}}
        <li class="category-item">
          <span class="category-name">{{.Name}}</span>
          <div class="category-actions">
            <form method="post" action="/categories?action=edit&id={{.ID}}">
              <input type="text" name="name" aria-label="New category name" placeholder="New name" required>
              <button type="submit" class="edit-btn">Edit</button>
            </form>
            <form method="post" action="/categories?action=delete&id={{.ID}}">
              <button type="submit" class="delete-btn">Delete</button>
            </form>
          </div>
        </li>
        {{end}}
      </ul>
    </div>
  </section>
</main>
{{template "site-footer" .}}</body>
</html>
