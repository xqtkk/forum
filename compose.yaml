services:
  forum:
    build: .
    restart: unless-stopped
    environment:
      FORUM_ENV: production
      FORUM_HTTP: "1"
      PUBLIC_BASE_URL: https://${FORUM_DOMAIN:?Set FORUM_DOMAIN}
      SESSION_TTL: ${SESSION_TTL:-24h}
      TRUSTED_PROXY_CIDRS: 172.31.50.2/32
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - forum-data:/data
      - forum-uploads:/app/uploads
    networks:
      forum-net:
        ipv4_address: 172.31.50.3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      FORUM_DOMAIN: ${FORUM_DOMAIN:?Set FORUM_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      forum-net:
        ipv4_address: 172.31.50.2
networks:
  forum-net:
    ipam:
      config:
        - subnet: 172.31.50.0/24
volumes:
  forum-data:
  forum-uploads:
  caddy-data:
  caddy-config:
